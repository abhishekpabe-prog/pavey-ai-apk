<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product AI</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f8f9fa; }
        
        /* --- LOGIN SCREEN --- */
        #login-screen {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: white; padding: 40px 30px; border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); width: 85%; max-width: 400px; text-align: center;
        }
        .login-btn { 
            background: #ff6b6b; color: white; border: none; padding: 15px; 
            width: 100%; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; 
            margin-top: 10px; transition: 0.3s;
        }
        .login-btn:hover { background: #ff5252; }

        /* --- DASHBOARD SCREEN --- */
        #dashboard-screen { display: none; }
        .navbar {
            background: #1e3c72; color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .container { padding: 20px; }
        .welcome-text { font-size: 22px; color: #1e3c72; font-weight: bold; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        /* Feature Grid */
        .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card {
            background: white; padding: 20px 15px; border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center;
            border: 1px solid #eee; cursor: pointer; transition: 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card .icon { font-size: 35px; margin-bottom: 10px; }
        .card h3 { margin: 0 0 5px 0; color: #333; font-size: 15px; }
        .card p { margin: 0; color: #888; font-size: 12px; }
    </style>
</head>
<body>

    <!-- LOGIN PAGE -->
    <div id="login-screen">
        <div class="login-box">
            <h1 style="color: #1e3c72; margin-top:0;">Product AI 🏪</h1>
            <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Sell Smart, Sell More!</p>
            <button class="login-btn" onclick="enterApp()">Enter Workspace</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard-screen">
        <div class="navbar">
            <span>Product AI</span>
            <span style="font-size: 24px;">⚙️</span>
        </div>
        
        <div class="container">
            <div class="welcome-text">Hello, Abhishek! 👋</div>
            <div class="subtitle">Ready to digitize some products today?</div>
            
            <div class="feature-grid">
                
                <div class="card" onclick="alert('Product Upload module will open here!')">
                    <div class="icon">📷</div>
                    <h3>Add Product</h3>
                    <p>Camera or Gallery</p>
                </div>
                
                <div class="card" onclick="alert('AI Image Enhancement tool loading...')">
                    <div class="icon">✨</div>
                    <h3>AI Image Magic</h3>
                    <p>Background & Shadow</p>
                </div>
                
                <div class="card" onclick="alert('SEO Content Generator loading...')">
                    <div class="icon">✍️</div>
                    <h3>SEO Content</h3>
                    <p>Titles & Details</p>
                </div>
                
                <div class="card" onclick="alert('Social Media Maker loading...')">
                    <div class="icon">📱</div>
                    <h3>Social Post</h3>
                    <p>Insta & WhatsApp</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        function enterApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard-screen").style.display = "block";
        }
    </script>

</body>
</html>
